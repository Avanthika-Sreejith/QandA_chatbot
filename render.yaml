services:
  - type: web
    name: qanda-chatbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: document_chunks
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: ENABLE_PDF_OCR
        value: "false"
      - key: ENABLE_STRUCTURED_RETRIEVAL
        value: "true"
      - key: STRUCTURE_SCORE_THRESHOLD
        value: "8"
      - key: STRUCTURED_MAX_SECTIONS
        value: "6"
