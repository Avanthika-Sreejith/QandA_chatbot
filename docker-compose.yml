services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: internship-chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    container_name: internship-chatbot-app
    ports:
      - "8501:8501"
    environment:
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface/transformers
      - EMBEDDING_DEVICE=cpu
    volumes:
      - hug_cache:/cache/huggingface
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  hug_cache:
